<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwaft — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090b12; --surface: rgba(255,255,255,0.045); --border: rgba(255,255,255,0.09);
    --violet:#7b61ff; --teal:#2bd9c9; --text:#f2f1f8; --muted:#8c90a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; position:relative; overflow-x:hidden; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 32px; border-bottom:1px solid var(--border); position:relative; z-index:2; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--teal), var(--violet));
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px; color:#0a0a12; }
  .brand span{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  header .tagline{ font-size:12.5px; color:var(--muted); }
  .center-wrap{ display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 68px); position:relative; padding:40px 20px; }
  .glow{ position:fixed; width:600px; height:600px; background:radial-gradient(circle, rgba(123,97,255,0.16), transparent 70%);
    top:-200px; right:-200px; z-index:0; pointer-events:none; }
  .card{ position:relative; z-index:1; width:400px; max-width:100%; background:var(--surface); border:1px solid var(--border);
    backdrop-filter:blur(18px); border-radius:20px; padding:44px 36px; text-align:center; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:600; margin-bottom:8px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:32px; line-height:1.5; }
  .btn-spotify{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:14px;
    background:#1DB954; border:none; border-radius:12px; color:#06110f; font-family:'Inter', sans-serif;
    font-weight:700; font-size:15px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  .btn-spotify:hover{ transform:translateY(-1px); box-shadow:0 8px 24px rgba(29,185,84,0.35); }
  .btn-spotify:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }
  .btn-spotify svg{ width:20px; height:20px; flex-shrink:0; }
  .note{ margin-top:20px; font-size:11.5px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="mark">H</div><span>Handwaft</span></div>
  <span class="tagline">Your webcam becomes the instrument.</span>
</header>

<div class="glow"></div>

<div class="center-wrap">
  <div class="card">
    <h1>Welcome to Handwaft</h1>
    <p class="sub">Sign in with Spotify to get started — no separate account needed.</p>

    <button class="btn-spotify" id="spotifyContinue">
      <svg viewBox="0 0 24 24" fill="#06110f"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.161-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 4.32-1.32 9.719-.66 13.439 1.62.36.181.54.78.301 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.3.421-1.02.599-1.56.3z"/></svg>
      Continue with Spotify
    </button>

    <p class="note">You'll be taken to Spotify to approve access, then brought straight back in.</p>
  </div>
</div>

<script>
  document.getElementById('spotifyContinue').addEventListener('click', () => {
    window.location.href = '/login/spotify';
  });
</script>
</body>
</html>
