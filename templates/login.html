<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwaft — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090b12; --surface: rgba(255,255,255,0.045); --border: rgba(255,255,255,0.09);
    --violet:#7b61ff; --teal:#2bd9c9; --coral:#ff6b4a; --text:#f2f1f8; --muted:#8c90a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; position:relative; overflow-x:hidden; }
  header{ display:flex; align-items:center; gap:10px; padding:18px 32px; border-bottom:1px solid var(--border); }
  .mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--teal), var(--violet));
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700; color:#0a0a12; }
  header span{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  .glow{ position:fixed; width:600px; height:600px; background:radial-gradient(circle, rgba(123,97,255,0.16), transparent 70%);
    top:-200px; right:-200px; z-index:0; pointer-events:none; }
  .center-wrap{ display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 68px); position:relative; padding:40px 20px; z-index:1; }
  .card{ width:400px; max-width:100%; background:var(--surface); border:1px solid var(--border);
    backdrop-filter:blur(18px); border-radius:20px; padding:44px 36px; text-align:center; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:600; margin-bottom:8px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:32px; line-height:1.5; }
  .btn-google{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:14px;
    background:#fff; border:none; border-radius:12px; color:#1f1f1f; font-family:'Inter', sans-serif;
    font-weight:700; font-size:15px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  .btn-google:hover{ transform:translateY(-1px); box-shadow:0 8px 24px rgba(255,255,255,0.15); }
  .btn-google:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }
  .btn-google svg{ width:20px; height:20px; flex-shrink:0; }
  .error-note{ font-size:12.5px; color:var(--coral); margin-top:16px; background:rgba(255,107,74,0.08);
    border:1px solid rgba(255,107,74,0.25); border-radius:8px; padding:9px 12px; display:none; }
  .error-note.show{ display:block; }
  .note{ margin-top:20px; font-size:11.5px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>

<header>
  <div class="mark">H</div><span>Handwaft</span>
</header>

<div class="glow"></div>

<div class="center-wrap">
  <div class="card">
    <h1>Welcome to Handwaft</h1>
    <p class="sub">Sign in with Google to get started — no separate account or password needed.</p>

    <button class="btn-google" id="googleLogin">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.48c-.28 1.5-1.13 2.78-2.4 3.63v3.02h3.88c2.27-2.09 3.56-5.17 3.56-8.84z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3.02c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.12C3.25 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.27a7.2 7.2 0 010-4.54V6.61H1.27a12 12 0 000 10.78l4-3.12z"/><path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.61l4 3.12C6.22 6.88 8.87 4.77 12 4.77z"/></svg>
      Continue with Google
    </button>

    <div class="error-note" id="loginError">Something went wrong signing in — please try again.</div>

    <p class="note">You'll be taken to Google to approve access, then brought straight back in.</p>
  </div>
</div>

<script>
  document.getElementById('googleLogin').addEventListener('click', () => {
    window.location.href = '/login/google';
  });

  // Show an error note if we were redirected back here after a failed login
  const params = new URLSearchParams(window.location.search);
  if(params.get('error')){
    document.getElementById('loginError').classList.add('show');
  }
</script>
</body>
</html>
